<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legal Alpha — judge profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg-dark:#050608;--bg-panel:#0A0C10;--bg-rail:#070809;--border:rgba(255,255,255,0.10);
--gold:#C4A25C;--gold-dim:rgba(196,162,92,0.20);--text-main:#EAEAEA;--text-muted:#8B8D91;
--red:#D24A4A;--green:#4AD295;--blue:#6AA9E0;--ff:"Inter",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;--r:10px;}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg-dark);color:var(--text-main);font-family:var(--ff);font-weight:300;font-size:14px}
.app{display:grid;grid-template-columns:212px 1fr;grid-template-rows:52px 1fr;height:100vh}
.topbar{grid-column:1/3;display:flex;align-items:center;gap:16px;padding:0 18px;border-bottom:1px solid var(--border);background:var(--bg-rail)}
.logo{font-family:var(--mono);font-weight:500;letter-spacing:.12em;color:var(--gold);font-size:14px;display:flex;align-items:center;gap:8px;text-decoration:none}
.logo .dot{width:8px;height:8px;background:var(--gold);border-radius:2px;transform:rotate(45deg)}
.logo b{color:#fff;font-weight:600}
.top-right{margin-left:auto;display:flex;align-items:center;gap:14px;color:var(--text-muted);font-family:var(--mono);font-size:11px}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#C4A25C,#7a6534);display:flex;align-items:center;justify-content:center;color:#050608;font-weight:600;font-family:var(--ff);font-size:12px}
.nav{border-right:1px solid var(--border);background:var(--bg-rail);padding:14px 10px;overflow:auto}
.nav .grp{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);margin:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;color:var(--text-muted);text-decoration:none;font-size:13px}
.nav a .ic{width:16px;text-align:center;opacity:.85}
.nav a.active{background:rgba(196,162,92,0.10);color:var(--gold);border:1px solid var(--gold-dim)}
.nav a:hover:not(.active){color:var(--text-main);background:rgba(255,255,255,0.03)}
.main{overflow:auto;padding:24px 26px 60px}
.crumb{font-family:var(--mono);font-size:11px;color:var(--text-muted)}
.crumb a{color:var(--text-muted);text-decoration:none}.crumb a:hover{color:var(--gold)}.crumb b{color:var(--gold)}
.hero{display:flex;gap:22px;align-items:flex-start;margin:16px 0 8px;flex-wrap:wrap}
.pf{width:132px;height:132px;object-fit:cover;object-position:top center;border-radius:10px;border:1px solid var(--border);background:#0e1116}
.noimg{width:132px;height:132px;border-radius:10px;border:1px dashed var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:34px;background:#0e1116}
.hero .who{flex:1;min-width:260px}
h1{font-family:var(--ff);font-weight:700;font-size:26px;margin:0 0 4px;letter-spacing:-0.01em}
.aka{color:var(--text-muted);font-size:12.5px;font-style:italic;margin:0 0 10px}
.row{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.b{font-family:var(--mono);font-size:10px;padding:3px 9px;border-radius:999px;border:1px solid var(--gold-dim);color:var(--gold);background:rgba(196,162,92,.05)}
.b.intl{color:var(--blue);border-color:rgba(106,169,224,.4);background:rgba(106,169,224,.08)}
.b.sg{color:var(--green);border-color:rgba(74,210,149,.4);background:rgba(74,210,149,.08)}
.b.award{color:var(--red);border-color:rgba(210,74,74,.35);background:rgba(210,74,74,.06)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:18px 0}
.stat{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--r);padding:13px 15px}
.stat .n{font-family:var(--mono);font-size:22px;color:var(--gold);font-weight:500}
.stat .l{font-size:11.5px;color:var(--text-muted);margin-top:3px}
h2{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);font-weight:400;margin:26px 0 10px;border-bottom:1px solid var(--border);padding-bottom:7px}
.panel{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
table{width:100%;border-collapse:collapse}
th{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);text-align:left;padding:9px 11px;border-bottom:1px solid var(--border);font-weight:400}
td{padding:10px 11px;border-bottom:1px solid rgba(255,255,255,.05);font-size:13px;vertical-align:top}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.02)}
.cite{font-family:var(--mono);font-size:10.5px;color:var(--gold)}
.amt{font-family:var(--mono);color:var(--gold);white-space:nowrap}
.wrote{font-family:var(--mono);font-size:10px;color:var(--green)}
.sat{font-family:var(--mono);font-size:10px;color:var(--text-muted)}
.cw{color:var(--text-muted);font-size:11.5px}
.foot{color:var(--text-muted);font-family:var(--mono);font-size:10.5px;margin-top:26px;border-top:1px solid var(--border);padding-top:12px;line-height:1.6}
.miss{color:var(--text-muted);font-size:12.5px;font-style:italic}
@media(max-width:1000px){.app{grid-template-columns:170px 1fr}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <a href="/" class="logo"><span class="dot"></span> LEGAL&nbsp;<b>ALPHA</b></a>
    <div class="top-right"><span>SG · SICC bench</span><div class="avatar">AZ</div></div>
  </div>
  <div class="nav">
    <div class="grp">SICC</div>
    <a href="sicc.html"><span class="ic">◎</span> Overview</a>
    <a href="sicc-cases.html"><span class="ic">▤</span> Judgments</a>
    <a class="active"><span class="ic">⚖</span> The bench</a>
    <a href="awards.html"><span class="ic">§</span> Money awards</a>
    <a href="sicc-bar.html"><span class="ic">⛨</span> Firms &amp; counsel</a>
    <a href="sicc-authorities.html"><span class="ic">⧉</span> Authorities</a>
    <div class="grp">Workspace</div>
    <a href="case-analysis.html"><span class="ic">▣</span> Alpha Extraction</a>
  </div>
  <div class="main" id="main">
    <div class="crumb"><a href="/">Seeking Alpha Legal</a> / <a href="judges.html">SICC bench</a> / <b id="crumbName">…</b></div>
    <div id="body"></div>
    <div class="foot" id="foot"></div>
  </div>
</div>
<script>
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function num(n){return (n==null)?'—':n.toLocaleString('en-US',{minimumFractionDigits:(n%1?2:0),maximumFractionDigits:2});}
var M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmt(s){if(!s)return '—';var a=String(s).split('-');return a.length<3?s:a[2]+' '+M[+a[1]-1]+' '+a[0];}
function qs(k){var m=new RegExp('[?&]'+k+'=([^&]*)').exec(location.search);return m?decodeURIComponent(m[1]):'';}

fetch('data/judges.json').then(function(r){return r.json();}).then(function(d){
  var id=qs('id'), j=d.judges.filter(function(x){return x.id===id;})[0];
  if(!j){
    document.getElementById('body').innerHTML='<h1>Judge not found</h1><p class="miss">No judge with id &ldquo;'+esc(id)+'&rdquo;. <a class="crumb" href="judges.html" style="color:var(--gold)">Back to the bench</a>.</p>';
    return;
  }
  document.title='Legal Alpha — '+j.name;
  document.getElementById('crumbName').textContent=j.name;

  var img=j.portrait?'<img class="pf" src="images/'+esc(j.portrait)+'" alt="'+esc(j.name)+'">':'<div class="noimg">⚖</div>';
  var bench=j.bench==='International Judge'?'<span class="b intl">International Judge</span>':'<span class="b sg">Singapore Judge</span>';
  var aka=(j.aka&&j.aka.length)?'<p class="aka">Also cited as '+esc(j.aka.join('; '))+'</p>':'';
  var hon=j.honorifics?'<span class="b">'+esc(j.honorifics)+'</span>':'';

  var awards=(j.awards||[]).slice().sort(function(a,b){return (b.amount||0)-(a.amount||0);});
  var biggest=awards.length?'<span class="b award">largest award '+esc(awards[0].currency)+' '+num(awards[0].amount)+'</span>':'';

  var subj=(j.topSubjects||[]).map(function(s){return '<span class="b">'+esc(s.name)+' · '+s.n+'</span>';}).join(' ')||'<span class="miss">none recorded</span>';
  var co=(j.coJudges||[]).map(function(c){return '<span class="b">'+esc(c.name)+' · '+c.n+'</span>';}).join(' ')||'<span class="miss">sat alone in this corpus</span>';

  var awardRows=awards.length
    ? '<table><thead><tr><th>Amount</th><th>Case</th><th>Beneficiary</th><th>Category</th></tr></thead><tbody>'+
      awards.map(function(a){return '<tr><td class="amt">'+esc(a.currency)+' '+num(a.amount)+'</td>'+
        '<td>'+esc(a.case)+'<br><span class="cite">'+esc(a.citation)+'</span></td>'+
        '<td>'+esc(a.beneficiary||'—')+'</td><td>'+esc(a.category||'—')+'</td></tr>';}).join('')+'</tbody></table>'
    : '<div class="panel"><span class="miss">No court money award recorded for this judge in the shortlisted set.</span></div>';

  var cases=(j.cases||[]).slice().sort(function(a,b){return String(b.date||'').localeCompare(String(a.date||''));});
  var caseRows='<table><thead><tr><th>Citation</th><th>Case</th><th>Decided</th><th>Role</th></tr></thead><tbody>'+
    cases.map(function(c){
      return '<tr><td><span class="cite">'+esc(c.citation||'—')+'</span></td>'+
        '<td>'+esc(c.name||'—')+(c.catchwords&&c.catchwords.length?'<br><span class="cw">'+esc(c.catchwords.slice(0,2).join(' · '))+'</span>':'')+'</td>'+
        '<td>'+fmt(c.date)+'</td>'+
        '<td>'+(c.authored?'<span class="wrote">authored</span>':'<span class="sat">sat</span>')+'</td></tr>';
    }).join('')+'</tbody></table>';

  document.getElementById('body').innerHTML=
    '<div class="hero">'+img+'<div class="who"><h1>'+esc(j.name)+'</h1>'+aka+
    '<div class="row">'+bench+hon+biggest+'</div></div></div>'+
    '<div class="stats">'+
      '<div class="stat"><div class="n">'+j.sat+'</div><div class="l">judgments sat on</div></div>'+
      '<div class="stat"><div class="n">'+j.authored+'</div><div class="l">judgments authored</div></div>'+
      '<div class="stat"><div class="n">'+(j.authoredPct||0)+'%</div><div class="l">authorship rate</div></div>'+
      '<div class="stat"><div class="n">'+awards.length+'</div><div class="l">recorded money awards</div></div>'+
    '</div>'+
    '<h2>Subject matter</h2><div class="panel"><div class="row">'+subj+'</div></div>'+
    '<h2>Frequent co-judges</h2><div class="panel"><div class="row">'+co+'</div></div>'+
    '<h2>Money awards</h2>'+awardRows+
    '<h2>Judgments in the corpus ('+cases.length+')</h2>'+caseRows;

  document.getElementById('foot').innerHTML=
    'LEGAL ALPHA · judge profile · built from '+esc(d._meta.corpus)+
    '<br>Counts are from canonicalised coram data; name variants are merged before counting. '+
    '&ldquo;Authored&rdquo; means this judge wrote the judgment, not merely sat on it. '+
    'Currencies are never converted or compared.';
}).catch(function(e){
  document.getElementById('body').innerHTML='<h1>Could not load</h1><p class="miss">data/judges.json — '+esc(String(e))+'</p>';
});
</script>
</body>
</html>
